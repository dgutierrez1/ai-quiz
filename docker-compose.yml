services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_quiz
      POSTGRES_PASSWORD: ai_quiz
      POSTGRES_DB: ai_quiz
    ports:
      - "5432:5432"
    volumes:
      - ai_quiz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_quiz -d ai_quiz"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ai_quiz_pg_data:
